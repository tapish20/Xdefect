[project]
name = "xdefect-api"
version = "1.0.0"
description = "Explainable Cross-Project Defect Prediction REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0"
]

[tool.vercel]
entrypoint = "api/index.py"
