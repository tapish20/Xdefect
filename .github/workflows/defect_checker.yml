name: XDefect Automated Code Reviewer

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  defect-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost shap

      - name: Run XDefect Inference & Recommendation Engine
        run: |
          python src/ci_cd_analyzer.py --pr-id ${{ github.event.pull_request.number }}

      - name: Post PR Review Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: outputs/recommendations/sample_github_pr_comment.md
